<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INVéSTIA Properties — Hospitality Data Form</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=GFS+Didot&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--card:#fff;--ink:#2b3f5c;--mut:#6b778a;--gold:#b8975a;--line:#e3dccd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2638;--card:#243350;--ink:#eee8da;--mut:#a9b3c4;--line:#3a4a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b2638;--card:#243350;--ink:#eee8da;--mut:#a9b3c4;--line:#3a4a6a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Montserrat,Arial,sans-serif}
header{text-align:center;padding:28px 16px 8px;position:relative}.brand{color:var(--gold);letter-spacing:.3em;font-size:12px;text-transform:uppercase}
h1{font:400 clamp(20px,4vw,28px) 'GFS Didot',Georgia,serif;text-transform:uppercase;letter-spacing:.08em;margin:8px 0}
.sub{color:var(--mut);max-width:640px;margin:0 auto}.lang{position:absolute;right:14px;top:12px}
.lang button{border:1px solid var(--gold);background:none;padding:4px 10px;cursor:pointer;color:var(--ink);font:inherit}.lang button.on{background:var(--gold);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);padding:18px}
h2{font:400 15px 'GFS Didot',Georgia,serif;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:10px 0 3px}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;border-radius:2px}
input[type=checkbox]{width:auto}.chk{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);margin:6px 0}
.hint{font-size:11px;color:var(--mut)}table{border-collapse:collapse;width:100%}td,th{padding:3px 6px;font-size:12px;text-align:left}
button,a.b{display:inline-block;background:var(--ink);color:var(--bg);border:0;padding:11px 20px;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font:inherit;font-size:12px;margin:10px 8px 0 0;text-decoration:none}
a.b.off{opacity:.4;pointer-events:none}
</style></head><body>
<header><div class="lang"><button id="bEL" onclick="setL('el')">ΕΛ</button><button id="bEN" onclick="setL('en')">EN</button></div>
<div class="brand">INVéSTIA Properties</div><h1 data-t="Property data form|Φόρμα στοιχείων μονάδας"></h1>
<p class="sub" data-t="Fill in what you know; approximate figures are fine and fields marked optional can stay empty. Nothing is sent from this page: you copy the result and email it to us.|Συμπληρώστε ό,τι γνωρίζετε· προσεγγιστικά νούμερα είναι αποδεκτά και τα προαιρετικά πεδία μπορούν να μείνουν κενά. Η σελίδα δεν στέλνει τίποτα: αντιγράφετε το αποτέλεσμα και το στέλνετε με email."></p></header>
<main>
<p class="hint" data-t="Privacy: this page does not store or send anything. Data you copy and email to INVéSTIA Properties is used only to prepare your offer.|Απόρρητο: η σελίδα δεν αποθηκεύει ούτε στέλνει τίποτα. Τα στοιχεία που αντιγράφετε και στέλνετε με email στην INVéSTIA Properties χρησιμοποιούνται μόνο για την προετοιμασία της προσφοράς σας."></p>
<section><h2 data-t="Business|Επιχείρηση"></h2><div id="a"></div></section>
<section><h2 data-t="Property|Μονάδα"></h2><div id="b"></div><label data-t="Solutions of interest (optional)|Λύσεις που σας ενδιαφέρουν (προαιρετικά)"></label><div id="s"></div></section>
<section><h2 data-t="Seasonality (optional)|Εποχικότητα (προαιρετικά)"></h2><details><summary data-t="Average occupancy % and ADR per month (leave closed months at 0)|Μέση πληρότητα % και ADR ανά μήνα (αφήστε 0 τους μήνες που είναι κλειστά)"></summary><div id="m"></div></details></section>
<section><h2 data-t="Result to send|Αποτέλεσμα προς αποστολή"></h2>
<label class="chk"><input type="checkbox" id="cons" onchange="gen()"><span data-t="I agree that INVéSTIA Properties may use these details to prepare an offer.|Συμφωνώ ότι η INVéSTIA Properties μπορεί να χρησιμοποιήσει αυτά τα στοιχεία για να ετοιμάσει προσφορά."></span></label>
<textarea id="out" rows="5" readonly></textarea>
<button onclick="cp()" data-t="Copy|Αντιγραφή"></button><a class="b" id="ml" href="#" data-t="Open email|Άνοιγμα email"></a><span id="m2" class="hint"></span></section>
</main>
<script>
const $=id=>document.getElementById(id);let L='el';const P=s=>s.split('|')[L=='el'?1:0];
const A=[['pname','Property / business name|Επωνυμία καταλύματος / επιχείρησης'],['legal','Legal name|Νομική επωνυμία'],['afm','VAT / Tax ID|ΑΦΜ'],['addr','Address|Διεύθυνση'],['cname','Contact person|Υπεύθυνος επικοινωνίας'],['cmail','Email|Email'],['cphone','Phone|Τηλέφωνο']];
const TY=['Villa / Boutique Hotel / Small Property (1–9)|Βίλα / Boutique Ξενοδοχείο / Μικρή Μονάδα (1–9)','Hotel with standard services like pool (10–74)|Ξενοδοχείο με βασικές υπηρεσίες π.χ. πισίνα (10–74)','Hotel with standard services like pool (75–200)|Ξενοδοχείο με βασικές υπηρεσίες π.χ. πισίνα (75–200)','Full-service hotel: restaurants, spa (10–74)|Ξενοδοχείο πλήρους εξυπηρέτησης: εστιατόρια, spa (10–74)','Full-service hotel: restaurants, spa (75–200)|Ξενοδοχείο πλήρους εξυπηρέτησης: εστιατόρια, spa (75–200)','Big Hotel / Resort (201+)|Μεγάλο Ξενοδοχείο / Resort (201+)','Restaurant / Café business|Εστιατόριο / Καφέ','Spa / Wellness business|Spa / Wellness','Casino / Integrated Resort|Casino / Integrated Resort'];
const B=[['rooms','Number of rooms (or seats/units)|Αριθμός δωματίων (ή θέσεων/μονάδων)'],['mopen','Months open per year|Μήνες λειτουργίας ανά έτος'],['pos','Points of sale (restaurants, bars, spa, shops)|Σημεία πώλησης (εστιατόρια, μπαρ, spa, καταστήματα)'],['langs','Guest languages to support|Γλώσσες επισκεπτών προς υποστήριξη'],['occ','Average occupancy %|Μέση πληρότητα %'],['adr','Average daily rate, ADR (€)|Μέση τιμή δωματίου, ADR (€)'],['ota','OTA commission %|Προμήθεια OTA %'],['dcost','Cost of a direct booking % (booking engine, payments, ads) – optional|Κόστος απευθείας κράτησης % (μηχανή κρατήσεων, πληρωμές, διαφήμιση) – προαιρετικό'],['alos','Average stay (nights)|Μέση διαμονή (διανυκτ.)'],['conv','Guest enquiries per open month (all channels)|Αιτήματα επισκεπτών ανά μήνα λειτουργίας (όλα τα κανάλια)'],['miss','Enquiries missed per open month (unanswered calls, late replies) – optional|Αιτήματα που χάνονται ανά μήνα (αναπάντητες κλήσεις, αργές απαντήσεις) – προαιρετικό'],['hr','Staff cost per hour (€) – optional|Κόστος προσωπικού ανά ώρα (€) – προαιρετικό'],['fcost','Employer cost of one reception/reservations position (€/month) – optional|Κόστος εργοδότη μιας θέσης υποδοχής/κρατήσεων (€/μήνα) – προαιρετικό'],['gv','Average group booking value (€) – optional|Μέση αξία ομαδικής κράτησης (€) – προαιρετικό']];
const T2=[['pms','Booking engine / PMS in use|Μηχανή κρατήσεων / PMS που χρησιμοποιείτε'],['ch','Guest channels you use today (website, WhatsApp, Facebook, phone…)|Κανάλια επικοινωνίας που χρησιμοποιείτε σήμερα (ιστοσελίδα, WhatsApp, Facebook, τηλέφωνο…)']];
const SOL=[['chat','AI chatbot (website & social)|AI chatbot (ιστοσελίδα & κοινωνικά δίκτυα)'],['voice','Voice AI|Φωνητικό AI'],['email','AI email assistant|AI βοηθός email'],['comp','Digital in-room guide|Ψηφιακός οδηγός δωματίου'],['out','Guest messaging|Μηνύματα προς επισκέπτες'],['spaces','Space booking|Κράτηση χώρων'],['aiva','Vouchers & gift cards|Voucher & δωροκάρτες']];
const MN='Jan|Ιαν,Feb|Φεβ,Mar|Μαρ,Apr|Απρ,May|Μάι,Jun|Ιουν,Jul|Ιουλ,Aug|Αυγ,Sep|Σεπ,Oct|Οκτ,Nov|Νοε,Dec|Δεκ'.split(',');
function build(){const old={};document.querySelectorAll('input,select').forEach(e=>old[e.id]=e.type=='checkbox'?e.checked:e.value);
const f=(a,t)=>a.map(x=>`<label>${P(x[1])}</label><input id='${x[0]}' type='${t||'text'}' oninput='gen()'>`).join('');
$('a').innerHTML=f(A);
$('b').innerHTML=`<label>${P('Business type and size|Τύπος και μέγεθος επιχείρησης')}</label><select id='type' onchange='gen()'><option value=''>—</option>${TY.map((x,i)=>`<option value='${i}'>${P(x)}</option>`).join('')}</select>`+f(B,'number')+f(T2);
$('s').innerHTML=SOL.map(x=>`<label class='chk'><input type='checkbox' id='sol_${x[0]}' onchange='gen()'><span>${P(x[1])}</span></label>`).join('');
$('m').innerHTML=`<table><tr><th></th><th>Occ %</th><th>ADR €</th></tr>${MN.map((m,i)=>`<tr><td>${P(m)}</td><td><input type='number' id='po${i}' oninput='gen()'></td><td><input type='number' id='pa${i}' oninput='gen()'></td></tr>`).join('')}</table>`;
for(const k in old){const e=$(k);if(e){if(e.type=='checkbox')e.checked=old[k];else e.value=old[k]}}gen()}
function gen(){const o={};[...A,...T2].forEach(x=>{const v=$(x[0]).value.trim();if(v!=='')o[x[0]]=v});
B.forEach(x=>{const v=$(x[0]).value.trim();if(v!=='')o[x[0]]=+v});
if($('type').value!=='')o.type=$('type').value;
const sol=SOL.filter(x=>$('sol_'+x[0]).checked).map(x=>x[0]);if(sol.length)o.sol=sol;
const po=[],pa=[];let any=false;for(let i=0;i<12;i++){po.push(+$('po'+i).value||0);pa.push(+$('pa'+i).value||0);if($('po'+i).value!==''||$('pa'+i).value!=='')any=true}
if(any){o.po=po;o.pa=pa}
const ok=$('cons').checked,code='INV1:'+JSON.stringify(o);
$('out').value=ok?code:P('Tick the consent box to generate the text.|Επιλέξτε το πλαίσιο συγκατάθεσης για να δημιουργηθεί το κείμενο.');
const ml=$('ml');ml.className='b'+(ok?'':' off');ml.href=ok?'mailto:mnstamataki@investiaprop.com?subject='+encodeURIComponent('Property data')+'&body='+encodeURIComponent(code):'#'}
function cp(){if(!$('cons').checked)return;$('out').select();try{navigator.clipboard.writeText($('out').value)}catch(e){document.execCommand('copy')}$('m2').textContent=P('Copied|Αντιγράφηκε')}
function setL(l){L=l;document.documentElement.lang=l;$('bEL').className=l=='el'?'on':'';$('bEN').className=l=='en'?'on':'';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=P(e.dataset.t));build()}
setL('el');
</script></body></html>
